<style>
  :root { --bg:#f7f8fa; --fg:#1f2733; --muted:#5b6573; --line:#e3e6eb; --accent:#2f66ad; }
  @media (prefers-color-scheme: dark) { :root { --bg:#07090d; --fg:#eef1f4; --muted:#a7abb0; --line:#272c31; --accent:#6f9bd6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 19px; margin: 32px 0 8px; }
  p, li { color: var(--fg); } .muted { color: var(--muted); font-size: 14px; }
  ul { padding-left: 20px; } li { margin: 4px 0; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
</style>
